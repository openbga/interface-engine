[package]
name = "packie-pdf"
description = "Pure reader of born-digital PDF reports: positioned text and labelled fields"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Unicode NFC for extracted text (already in the dependency tree).
icu_normalizer = "2.4"
# PDF file structure: cross-reference recovery, decryption with the empty password, bounded
# decompression, content-stream tokens and encodings. Defaults pull in clocks and threads.
lopdf = { version = "0.47", default-features = false }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
